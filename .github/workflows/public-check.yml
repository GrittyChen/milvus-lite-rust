# 公开下载核验：对已发布的 Release 只读公开地址，重复发布准备的核对后安装冒烟（0021 第 20 条）。
# 只由 workflow_dispatch 触发；没有 contents: write、id-token: write 或 attestations: write，tag 与 Release 由负责人人工创建。
# 发行集合由冻结 tag 中的 release_set.py 核对：阶段矩阵随测试数量变化，不能用默认分支的工具校验较早的候选。
name: Public check
run-name: public-check v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 已发布的版本（Python 形式，如 0.4.0rc1），核对 tag v<版本> 的 Release
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    # 显式指定后为 bash -eo pipefail，管道中任何命令失败都使步骤失败（0020 公共约定）。
    shell: bash

concurrency:
  group: public-check-${{ inputs.version }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  VERSION: ${{ inputs.version }}

jobs:
  verify:
    # 从其他分支或 tag 触发时，运行的是那里的工作流与检查器，不是默认分支的；跳过后 public-pass 失败。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    outputs:
      sums_sha256: ${{ steps.sums.outputs.sha256 }}
    steps:
      # 默认分支的工具与冻结 tag 检出到不同目录，后一次 checkout 不会覆盖前者。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: default
          fetch-depth: 0
          persist-credentials: false
      - name: 版本格式
        run: python3 default/.github/ci/public_release.py check-version --version "$VERSION"
      - name: Release 属性
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 default/.github/ci/public_release.py fetch --repo "$GITHUB_REPOSITORY" --version "$VERSION" --out "$RUNNER_TEMP/release.json"
      - name: 匿名下载附件
        run: python3 default/.github/ci/public_release.py download --record "$RUNNER_TEMP/release.json" --out "$RUNNER_TEMP/release"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          path: frozen
          fetch-depth: 0
          persist-credentials: false
      - name: 发行集合（冻结 tag 的 release_set）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 frozen/tests/release/release_set.py --dir "$RUNNER_TEMP/release" --version "$VERSION" --repo "$GITHUB_REPOSITORY"
      - name: tag 提交
        run: python3 default/.github/ci/public_release.py tag-commit --dir "$RUNNER_TEMP/release" --tag-dir frozen --version "$VERSION"
      - name: 交给安装 job 的 SHA256SUMS
        id: sums
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/release/SHA256SUMS" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-sums
          path: ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  install:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: manylinux_2_28_x86_64 }
          - { os: ubuntu-24.04-arm, platform: manylinux_2_28_aarch64 }
          - { os: macos-15, platform: macosx_11_0_arm64 }
          - { os: macos-15-intel, platform: macosx_11_0_x86_64 }
    name: install (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PLATFORM: ${{ matrix.platform }}
      SUMS_SHA256: ${{ needs.verify.outputs.sums_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: default
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.12"
      - name: 版本格式
        env:
          PY: ${{ steps.python.outputs.python-path }}
        run: |
          "$PY" default/.github/ci/public_release.py check-version --version "$VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          path: frozen
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-sums
          path: ${{ runner.temp }}/verified
      - name: 干净环境中从公开地址安装
        env:
          PY: ${{ steps.python.outputs.python-path }}
        run: |
          "$PY" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -q --no-cache-dir --only-binary :all: -r frozen/.github/ci/requirements/sdk30.txt
          "$PY" default/.github/ci/public_release.py install --repo "$GITHUB_REPOSITORY" --version "$VERSION" \
            --platform "$PLATFORM" --tag-dir frozen --python "$RUNNER_TEMP/venv/bin/python" \
            --sums "$RUNNER_TEMP/verified/SHA256SUMS" --sums-sha256 "$SUMS_SHA256" --report "$RUNNER_TEMP/pip-report.json"
      - name: 联合冒烟
        env:
          PY: ${{ steps.python.outputs.python-path }}
        run: |
          "$PY" default/.github/ci/public_release.py smoke --version "$VERSION" --sdk 3.0.2 --tag-dir frozen \
            --python "$RUNNER_TEMP/venv/bin/python" --work-dir "$RUNNER_TEMP/smoke"

  public-pass:
    # 任何 job 失败或跳过（包括 verify 失败后 install 被跳过）都使公开核验失败。
    if: always()
    needs: [verify, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 全部 job 成功
        env:
          VERIFY: ${{ needs.verify.result }}
          INSTALL: ${{ needs.install.result }}
        run: test "$VERIFY" = success && test "$INSTALL" = success
