[workspace]
resolver = "3"
members = ["crates/core", "crates/grpc", "crates/py"]

[workspace.package]
version = "0.3.0-rc.2"
edition = "2024"
# File::try_lock 自 1.89 起稳定，LOCK 的 flock 语义依赖它。
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
libc = "0.2"
md5 = "0.8.1"
arrow-array = "~60.0"
arrow-ipc = "~60.0"
arrow-schema = "~60.0"
milvus-lite-core = { path = "crates/core" }
milvus-lite-grpc = { path = "crates/grpc" }
parking_lot = "0.12.5"
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.9.1"
pyo3 = "0.29.2"
rayon-core = "1.13.0"
serde = { version = "1.0", features = ["derive"] }
# 保留 JSON 字段的键序与任意精度整数；动态字段落盘时另按 Python sort_keys 排序。
serde_json = { version = "1.0.151", features = ["float_roundtrip", "preserve_order", "arbitrary_precision"] }
thiserror = "2.0.21"
parquet = { version = "~60.0", default-features = false, features = ["arrow", "snap"] }
tokio = "1.53.1"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
