[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "milvus-lite-rust"
dynamic = ["version"]
readme = "README.md"
license-files = ["LICENSE", "crates/grpc/proto/LICENSE"]
description = "Unofficial Rust implementation of milvus-lite; not affiliated with Milvus or Zilliz."
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",

    "Programming Language :: Python :: Implementation :: CPython",
]

[project.scripts]
milvus-lite = "milvus_lite.cmdline:main"

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
python-source = "crates/py/python"
module-name = "milvus_lite._native"
exclude = ["**/__pycache__/**"]
